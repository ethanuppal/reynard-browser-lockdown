name: Update Reynard Altsource

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  build:
    name: Build Standard
    runs-on: macos-26
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: standard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: 'docs'

      - name: Generate AltSource
        run: node sourcegen.js ethanuppal/reynard-browser-lockdown com.minh-ton.Reynard > source.json

      - name: Upload AltSource
        run: |
          git config user.name "Ethan Uppal"
          git config user.email "113849268+ethanuppal@users.noreply.github.com"
          git add source.json
          git commit -m "Update AltSource"
          git push origin docs
