name: Build Reynard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    name: Build Standard
    runs-on: macos-26
    outputs:
      size: ${{ steps.calcipasize.outputs.size }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: standard

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Setup upstream submodule
        run: |
          git submodule update --init --depth 1
          cd reynard-browser
          git fetch --tags
          REYNARD_VERSION=$(git tag --sort version:refname | tail -n2 | head -n1)
          echo "REYNARD_VERSION=$REYNARD_VERSION" >> $GITHUB_ENV
          git fetch origin $REYNARD_VERSION
          git checkout $REYNARD_VERSION


          # check if we already published this version
          # FIXME: handle when we change patches on the same version
          cd ..
          # pwd
          git ls-remote --tags origin $REYNARD_VERSION | grep -q $REYNARD_VERSION && { \
            echo "Version $REYNARD_VERSION already has a release in ethanuppal/reynard-browser-lockdown" \
            gh run cancel ${{ github.run_id }}; \
            exit 1; \
          } || { \
            echo "Version $REYNARD_VERSION does not have a release ethanuppal/reynard-browser-lockdown, building one"; \
          }

      - name: Merge additional patches
        run: |
          cp -r ./additional-patches/ reynard-browser/patches

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize submodules
        run: |
          cd reynard-browser
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: cd reynard-browser && ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: cd reynard-browser && ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: buildcache-gecko-deps-standard-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            buildcache-gecko-deps-standard-${{ steps.rust_toolchain.outputs.hash }}-
          lookup-only: true

      - name: Restore idevice build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            reynard-browser/support/idevice/target
            reynard-browser/browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('reynard-browser/support/idevice/Cargo.lock', 'reynard-browser/support/idevice/Cargo.toml', 'reynard-browser/tools/development/build-idevice.sh') }}
          restore-keys: |
            buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-
          lookup-only: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build Gecko
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: cd reynard-browser && ./tools/development/build-gecko.sh --use-sccache --auto-clobber

      - name: Build idevice support library
        run: cd reynard-browser && ./tools/development/build-idevice.sh

      - name: Install packaging dependencies
        run: brew install ldid

      - name: Build app
        run: cd reynard-browser && ./tools/release/build-app.sh --no-signing

      - name: Create IPA
        run: cd reynard-browser && ./tools/release/create-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Reynard.ipa
          path: reynard-browser/dist/Reynard.ipa
          if-no-files-found: error

      - name: Calculate IPA size
        id: calcipasize
        run: echo "size=$(wc -c < reynard-browser/dist/Reynard.ipa)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.REYNARD_VERSION }}
          files: reynard-browser/dist/Reynard.ipa

  update:
    name: Update AltSource
    needs: build
    runs-on: macos-26
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: standard

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: false
          ref: 'docs'
          persist-credentials: false

      - name: Generate AltSource
        run: node sourcegen.js ethanuppal/reynard-browser-lockdown com.minh-ton.Reynard ${NEEDS_BUILD_OUTPUTS_SIZE} > source.json
        env:
          NEEDS_BUILD_OUTPUTS_SIZE: ${{ needs.build.outputs.size }}

      - name: Upload AltSource
        run: |
          git config user.name "Ethan Uppal"
          git config user.email "113849268+ethanuppal@users.noreply.github.com"
          git add source.json
          git commit -m "[bot action] Update AltSource"
          git push origin docs
