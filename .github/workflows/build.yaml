name: Build Reynard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.repository_owner == 'ethanuppal' }}
    name: Select build variants
    runs-on: ubuntu-latest
    steps:
      - name: Select matrix
        id: matrix
        uses: actions/github-script@v9
        env:
          BUILD_NORMAL_IPA: "true"
          BUILD_TROLLSTORE_TIPA: "false"
          BUILD_JAILBROKEN_IPA: "false"
        with:
          script: |
            const variants = [];

            if (
              process.env.BUILD_NORMAL_IPA === 'true' ||
              process.env.BUILD_TROLLSTORE_TIPA === 'true'
            ) {
              variants.push({
                variant: 'standard',
                build_args: '--use-sccache --auto-clobber',
                sccache_namespace: 'standard',
              });
            }

            if (
              process.env.BUILD_JAILBROKEN_IPA === 'true'
            ) {
              variants.push({
                variant: 'nojemalloc',
                build_args: '--disable-jemalloc --use-sccache --auto-clobber',
                sccache_namespace: 'nojemalloc',
              });
            }

            core.setOutput('matrix', JSON.stringify({ include: variants }));
            core.setOutput('should_build', String(variants.length > 0));

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: Build Standard
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ matrix.sccache_namespace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      - name: Setup upstream submodule
        run: |
          git submodule update --init --depth 1
          cd reynard-browser
          REYNARD_VERSION=$(git describe --tags --abbrev=0)
          git fetch origin $REYNARD_VERSION
          git checkout $REYNARD_VERSION

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize submodules
        run: |
          cd reynard-browser && git submodule sync --recursive
          cd reynard-browser && git submodule update --init --recursive support/idevice
          cd reynard-browser && git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: cd reynard-browser && ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: cd reynard-browser && ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            reynard-browser/support/idevice/target
            reynard-browser/browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('reynard-browser/support/idevice/Cargo.lock', 'reynard-browser/support/idevice/Cargo.toml', 'reynard-browser/tools/development/build-idevice.sh') }}
          restore-keys: |
            buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Gecko
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: cd reynard-browser && ./tools/development/build-gecko.sh ${{ matrix.build_args }}

      - name: Build idevice support library
        run: cd reynard-browser && ./tools/development/build-idevice.sh

      - name: Install packaging dependencies
        run: brew install ldid

      - name: Build app
        run: cd reynard-browser && ./tools/release/build-app.sh --nightly

      - name: Create IPA
        run: cd reynard-browser && ./tools/release/create-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reynard.ipa
          path: reynard-browser/dist/Reynard.ipa
          if-no-files-found: error
